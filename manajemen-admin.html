<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manajemen Admin - Admin Tebak-Tebak Cuan</title>

<style>
body{
font-family:Arial, sans-serif;
background:#f5f5f5;
margin:0;
}

header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
font-size:24px;
}

.container{
padding:20px;
max-width: 900px;
margin: auto;
}

.card {
background: white;
padding: 20px;
border-radius: 10px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
margin-bottom: 20px;
}

.form-group {
margin-bottom: 15px;
}

label {
display: block;
margin-bottom: 5px;
font-weight: bold;
color: #333;
}

input {
width: 100%;
padding: 10px;
border: 1px solid #ccc;
border-radius: 6px;
box-sizing: border-box;
font-size: 14px;
}

button {
padding: 10px 15px;
font-size: 14px;
border: none;
border-radius: 6px;
background: #2563eb;
color: white;
cursor: pointer;
}

button:hover {
opacity: 0.9;
}

.btn-kembali {
background: #6b7280;
margin-bottom: 15px;
}

table {
width: 100%;
border-collapse: collapse;
margin-top: 10px;
}

th, td {
padding: 12px;
text-align: left;
border-bottom: 1px solid #ddd;
font-size: 14px;
}

th {
background-color: #f8f9fa;
color: #333;
}

.btn-hapus {
background: #ef4444;
}
</style>
</head>
<body>

<header>
Manajemen Akun Admin
</header>

<div class="container">

<button class="btn-kembali" onclick="location.href='Admin-dashboard.html'">← Kembali ke Dashboard</button>

<!-- Form Tambah Admin Baru -->
<div class="card">
    <h3>Tambah Admin Baru</h3>
    <form id="form-tambah-admin">
        <div class="form-group">
            <label>Nama Admin:</label>
            <input type="text" id="namaAdmin" placeholder="Masukkan nama admin" required>
        </div>
        <div class="form-group">
            <label>Email Admin:</label>
            <input type="email" id="emailAdmin" placeholder="admin@domain.com" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="passwordAdmin" placeholder="Masukkan password" required>
        </div>
        <button type="submit">Tambah Akun Admin</button>
    </form>
</div>

<!-- Daftar Akun Admin -->
<div class="card">
    <h3>Daftar Pengelola / Admin</h3>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Email</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tabel-admin">
            <tr>
                <td colspan="4" style="text-align: center; color: #666;">Memuat data admin...</td>
            </tr>
        </tbody>
    </table>
</div>

</div>

<!-- Skrip Firebase & Logika Manajemen Admin -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Menggunakan konfigurasi Firebase asli proyek Anda
    const firebaseConfig = {
      apiKey: "AIzaSyCqE8yJBHcCiWbgOo53RR-TlZW-Ia8XTvc",
      authDomain: "tebak-tebak-cuan-ef0d7.firebaseapp.com",
      projectId: "tebak-tebak-cuan-ef0d7",
      storageBucket: "tebak-tebak-cuan-ef0d7.firebasestorage.app",
      messagingSenderId: "399613865817",
      appId: "1:399613865817:web:0eae23e826d8544741e648",
      measurementId: "G-E9227HR8G8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const formTambahAdmin = document.getElementById('form-tambah-admin');
    const tabelAdmin = document.getElementById('tabel-admin');

    // 1. Muat daftar akun yang memiliki role admin dari database
    async function muatDaftarAdmin() {
        try {
            const querySnapshot = await getDocs(collection(db, "user"));
            tabelAdmin.innerHTML = "";

            let no = 0;
            let adaAdmin = false;

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                if (data.role === 'admin') {
                    adaAdmin = true;
                    no++;
                    const idAdmin = docSnap.id;

                    const row = `
                        <tr>
                            <td>${no}</td>
                            <td>${data.nama || 'Admin'}</td>
                            <td>${data.email || '-'}</td>
                            <td>
                                <button class="btn-hapus" onclick="hapusAdmin('${idAdmin}')">Hapus</button>
                            </td>
                        </tr>
                    `;
                    tabelAdmin.innerHTML += row;
                }
            });

            if (!adaAdmin) {
                tabelAdmin.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #666;">Belum ada data admin terdaftar.</td></tr>`;
            }

        } catch (error) {
            console.error("Gagal memuat admin:", error);
            tabelAdmin.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Gagal memuat data admin dari database.</td></tr>`;
        }
    }

    // 2. Tambah Admin Baru ke Database
    formTambahAdmin.addEventListener('submit', async (e) => {
        e.preventDefault();
        const nama = document.getElementById('namaAdmin').value;
        const email = document.getElementById('emailAdmin').value;
        const password = document.getElementById('passwordAdmin').value;

        try {
            await addDoc(collection(db, "user"), {
                nama: nama,
                email: email,
                password: password,
                role: 'admin',
                createdAt: new Date()
            });

            alert("Akun admin baru berhasil ditambahkan!");
            formTambahAdmin.reset();
            muatDaftarAdmin();
        } catch (error) {
            alert("Gagal menambahkan admin: " + error.message);
        }
    });

    // 3. Hapus Akses Admin
    window.hapusAdmin = async function(id) {
        if (confirm("Apakah kamu yakin ingin menghapus akun admin ini?")) {
            try {
                await deleteDoc(doc(db, "user", id));
                alert("Akun admin berhasil dihapus!");
                muatDaftarAdmin();
            } catch (error) {
                alert("Gagal menghapus admin: " + error.message);
            }
        }
    }

    window.onload = muatDaftarAdmin;
</script>

</body>
</html>
