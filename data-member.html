<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Member - Admin Tebak-Tebak Cuan</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
font-size:24px;
}

.container{
padding:20px;
max-width: 1200px;
margin: auto;
}

.card {
background: white;
padding: 20px;
border-radius: 10px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
margin-bottom: 20px;
overflow-x: auto;
}

.search-box {
width: 100%;
padding: 12px;
margin-bottom: 15px;
border: 1px solid #ccc;
border-radius: 6px;
box-sizing: border-box;
font-size: 14px;
}

table {
width: 100%;
border-collapse: collapse;
margin-top: 10px;
white-space: nowrap;
}

th, td {
padding: 12px;
text-align: left;
border-bottom: 1px solid #ddd;
font-size: 14px;
}

th {
background-color: #f8f9fa;
color: #333;
}

button{
padding: 8px 12px;
font-size: 13px;
border:none;
border-radius: 6px;
background: #ef4444;
color: white;
cursor: pointer;
}

button:hover {
opacity: 0.9;
}

.btn-kembali {
background: #6b7280;
margin-bottom: 15px;
padding: 10px 15px;
font-size: 14px;
border-radius: 8px;
color: white;
cursor: pointer;
border: none;
}
</style>

</head>
<body>

<header>
Data Member
</header>

<div class="container">

<button class="btn-kembali" onclick="location.href='Admin-dashboard.html'">← Kembali ke Dashboard</button>

<div class="card">
    <h3>Daftar Informasi & Saldo Member</h3>
    
    <!-- Kotak Pencarian -->
    <input type="text" id="inputPencarian" class="search-box" placeholder="🔍 Cari berdasarkan nama, ID member, nama rekening, no rekening, atau jumlah uang..." onkeyup="filterTabel()">

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama & ID Member</th>
                <th>Username</th>
                <th>Email</th>
                <th>Nomor HP</th>
                <th>Metode Pembayaran</th>
                <th>Nama Rekening</th>
                <th>Nomor Rekening</th>
                <th>Saldo / Poin</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tabel-member">
            <tr>
                <td colspan="10" style="text-align: center; color: #666;">Memuat data member...</td>
            </tr>
        </tbody>
    </table>
</div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCqE8yJBHcCiWbgOo53RR-TlZW-Ia8XTvc",
      authDomain: "tebak-tebak-cuan-ef0d7.firebaseapp.com",
      projectId: "tebak-tebak-cuan-ef0d7",
      storageBucket: "tebak-tebak-cuan-ef0d7.firebasestorage.app",
      messagingSenderId: "399613865817",
      appId: "1:399613865817:web:0eae23e826d8544741e648",
      measurementId: "G-E9227HR8G8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let semuaDataMember = [];

    async function ambilDataMember() {
        const tabelBody = document.getElementById('tabel-member');
        
        try {
            const querySnapshot = await getDocs(collection(db, "member"));
            tabelBody.innerHTML = "";
            
            if (querySnapshot.empty) {
                tabelBody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: #666;">Belum ada data member.</td></tr>`;
                return;
            }

            semuaDataMember = [];
            querySnapshot.forEach((docSnap) => {
                semuaDataMember.push({
                    id: docSnap.id,
                    ...docSnap.data()
                });
            });

            renderTabel(semuaDataMember);

        } catch (error) {
            console.error("Gagal mengambil data: ", error);
            tabelBody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: red;">Gagal memuat data. Periksa Rules Firestore.</td></tr>`;
        }
    }

    function renderTabel(dataArray) {
        const tabelBody = document.getElementById('tabel-member');
        tabelBody.innerHTML = "";

        if (dataArray.length === 0) {
            tabelBody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: #666;">Data tidak ditemukan.</td></tr>`;
            return;
        }

        let no = 0;
        dataArray.forEach((data) => {
            no++;
            const idMember = data.id;
            const jumlahPoin = Number(data.poin ?? data.saldo ?? 0);

            const row = `
                <tr>
                    <td>${no}</td>
                    <td>
                        <strong>${data.nama || '-'}</strong><br>
                        <small style="color: #666;">ID: ${idMember}</small>
                    </td>
                    <td>${data.username || '-'}</td>
                    <td>${data.email || '-'}</td>
                    <td>${data.hp || '-'}</td>
                    <td>${data.metode || '-'}</td>
                    <td>${data.namaRekening || '-'}</td>
                    <td>${data.nomorRekening || '-'}</td>
                    <td><strong style="color: #2563eb;">Rp ${jumlahPoin.toLocaleString()}</strong></td>
                    <td>
                        <button onclick="hapusMember('${idMember}')">Hapus</button>
                    </td>
                </tr>
            `;
            tabelBody.innerHTML += row;
        });
    }

    // Fungsi pencarian real-time (termasuk Nama Rekening)
    window.filterTabel = function() {
        const keyword = document.getElementById('inputPencarian').value.toLowerCase();

        const hasilFilter = semuaDataMember.filter(item => {
            const nama = (item.nama || '').toLowerCase();
            const id = (item.id || '').toLowerCase();
            const namaRek = (item.namaRekening || '').toLowerCase();
            const noRek = (item.nomorRekening || '').toLowerCase();
            const poin = String(item.poin ?? item.saldo ?? 0).toLowerCase();

            return nama.includes(keyword) || 
                   id.includes(keyword) || 
                   namaRek.includes(keyword) || 
                   noRek.includes(keyword) || 
                   poin.includes(keyword);
        });

        renderTabel(hasilFilter);
    }

    window.hapusMember = async function(id) {
        if (confirm("Apakah kamu yakin ingin menghapus member ini?")) {
            try {
                await deleteDoc(doc(db, "member", id));
                alert("Member berhasil dihapus!");
                ambilDataMember();
            } catch (error) {
                alert("Gagal menghapus: " + error.message);
            }
        }
    }

    window.onload = ambilDataMember;
</script>

</body>
</html>
