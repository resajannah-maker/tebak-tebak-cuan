<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Penarikan - Admin Tebak-Tebak Cuan</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
margin:0;
}

header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
font-size:24px;
}

.container{
padding:20px;
max-width: 1000px;
margin: auto;
}

.card {
background: white;
padding: 20px;
border-radius: 10px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
margin-bottom: 20px;
overflow-x: auto;
}

table {
width: 100%;
border-collapse: collapse;
margin-top: 10px;
white-space: nowrap;
}

th, td {
padding: 12px;
text-align: left;
border-bottom: 1px solid #ddd;
font-size: 14px;
}

th {
background-color: #f8f9fa;
color: #333;
}

button{
padding: 6px 12px;
font-size: 13px;
border:none;
border-radius: 6px;
cursor: pointer;
color: white;
}

.btn-terima {
background: #10b981; 
margin-right: 5px;
}

.btn-tolak {
background: #ef4444; 
}

button:hover {
opacity: 0.9;
}

.btn-kembali {
background: #6b7280;
margin-bottom: 15px;
width: auto;
padding: 10px 15px;
font-size: 14px;
border-radius: 8px;
color: white;
border: none;
cursor: pointer;
}
</style>

</head>
<body>

<header>
Verifikasi Penarikan (Withdraw) Member
</header>

<div class="container">

<!-- Link disesuaikan ke admin-dashboard.html (a kecil) -->
<button class="btn-kembali" onclick="location.href='admin-dashboard.html'">← Kembali ke Dashboard</button>

<div class="card">
    <h3>Daftar Permintaan Penarikan Saldo Menunggu Konfirmasi</h3>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>ID Member</th>
                <th>Jumlah Penarikan</th>
                <th>Metode / Rekening</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tabel-penarikan">
            <tr>
                <td colspan="6" style="text-align: center; color: #666;">Memuat data penarikan...</td>
            </tr>
        </tbody>
    </table>
</div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCqE8yJBHcCiWbgOo53RR-TlZW-Ia8XTvc",
      authDomain: "tebak-tebak-cuan-ef0d7.firebaseapp.com",
      projectId: "tebak-tebak-cuan-ef0d7",
      storageBucket: "tebak-tebak-cuan-ef0d7.firebasestorage.app",
      messagingSenderId: "399613865817",
      appId: "1:399613865817:web:0eae23e826d8544741e648",
      measurementId: "G-E9227HR8G8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function muatDataPenarikan() {
        const tabelBody = document.getElementById('tabel-penarikan');
        
        try {
            const querySnapshot = await getDocs(collection(db, "penarikan"));
            tabelBody.innerHTML = "";
            
            if (querySnapshot.empty) {
                tabelBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #666;">Tidak ada permintaan penarikan saat ini.</td></tr>`;
                return;
            }

            let no = 0;
            querySnapshot.forEach((docSnap) => {
                no++;
                const data = docSnap.data();
                const penarikanId = docSnap.id;
                const status = data.status || 'Pending';
                
                const idTargetMember = data.uid || data.memberId || data.userId || '';

                let tombolAksi = `-`;
                if (status === 'Pending' || status === 'menunggu') {
                    tombolAksi = `
                        <button class="btn-terima" onclick="prosesPenarikan('${penarikanId}', '${idTargetMember}', ${data.jumlah || data.nominal || 0}, 'terima')">Setujui</button>
                        <button class="btn-tolak" onclick="prosesPenarikan('${penarikanId}', '${idTargetMember}', 0, 'tolak')">Tolak</button>
                    `;
                } else {
                    tombolAksi = `<span style="color: gray; font-style: italic;">Sudah diproses</span>`;
                }

                const infoRekening = `${data.metode || 'Bank'} - ${data.nomorRekening || data.rekening || '-'} (${data.namaRekening || data.nama || '-'})`;

                const row = `
                    <tr>
                        <td>${no}</td>
                        <td>${idTargetMember || 'Tidak diketahui'}</td>
                        <td><strong>Rp ${Number(data.jumlah || data.nominal || 0).toLocaleString()}</strong></td>
                        <td>${infoRekening}</td>
                        <td><span style="color: ${status === 'Pending' ? 'orange' : (status === 'Berhasil' ? 'green' : 'red')}; font-weight: bold;">${status}</span></td>
                        <td>${tombolAksi}</td>
                    </tr>
                `;
                tabelBody.innerHTML += row;
            });

        } catch (error) {
            console.error("Gagal memuat penarikan:", error);
            tabelBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">Gagal memuat data. Periksa Rules Firestore.</td></tr>`;
        }
    }

    window.prosesPenarikan = async function(penarikanId, memberId, jumlah, aksi) {
        try {
            const penarikanRef = doc(db, "penarikan", penarikanId);

            if (aksi === 'terima') {
                if (!memberId) {
                    alert("ID Member tidak valid pada data penarikan ini.");
                    return;
                }

                const memberRef = doc(db, "member", memberId);
                const memberSnap = await getDoc(memberRef);

                if (!memberSnap.exists()) {
                    alert("Akun member tidak ditemukan di database!");
                    return;
                }

                const dataMember = memberSnap.data();
                const saldoLama = Number(dataMember.poin ?? dataMember.saldo ?? 0);
                const jumlahTarik = Number(jumlah);

                if (saldoLama < jumlahTarik) {
                    alert(`Gagal! Saldo member tidak mencukupi. Saldo saat ini: ${saldoLama.toLocaleString()}, Permintaan tarik: ${jumlahTarik.toLocaleString()}`);
                    return;
                }

                const saldoBaru = saldoLama - jumlahTarik;

                await updateDoc(memberRef, {
                    poin: saldoBaru,
                    saldo: saldoBaru
                });

                await updateDoc(penarikanRef, {
                    status: 'Berhasil'
                });

                alert(`Penarikan berhasil disetujui! Saldo member telah dikurangi sebesar Rp ${jumlahTarik.toLocaleString()}`);
            } else {
                await updateDoc(penarikanRef, {
                    status: 'Ditolak'
                });
                alert("Permintaan penarikan telah ditolak.");
            }

            muatDataPenarikan();

        } catch (error) {
            alert("Terjadi kesalahan saat memproses: " + error.message);
        }
    }

    window.onload = muatDataPenarikan;
</script>

</body>
</html>
