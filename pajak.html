<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan Pajak & Penghasilan - Admin Tebak-Tebak Cuan</title>

<style>
body{
font-family:Arial, sans-serif;
background:#f5f5f5;
margin:0;
}

header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
font-size:24px;
}

.container{
padding:20px;
max-width: 600px;
margin: auto;
}

.card {
background: white;
padding: 20px;
border-radius: 10px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
margin-bottom: 20px;
}

.form-group {
margin-bottom: 15px;
}

label {
display: block;
margin-bottom: 5px;
font-weight: bold;
color: #333;
}

input, select {
width: 100%;
padding: 10px;
border: 1px solid #ccc;
border-radius: 6px;
box-sizing: border-box;
font-size: 14px;
}

button {
padding: 10px 15px;
font-size: 14px;
border: none;
border-radius: 6px;
background: #2563eb;
color: white;
cursor: pointer;
width: 100%;
}

button:hover {
opacity: 0.9;
}

/* Styling untuk tombol kembali agar selaras */
.btn-kembali {
background: #6b7280;
margin-bottom: 20px;
width: 100%;
}

.btn-kembali:hover {
background: #4b5563;
}

.stat-box {
background: #eff6ff;
border: 1px solid #bfdbfe;
padding: 15px;
border-radius: 8px;
text-align: center;
margin-top: 15px;
}

.stat-box h4 {
margin: 0 0 5px 0;
color: #1e40af;
font-size: 14px;
}

.stat-box p {
margin: 0;
font-size: 22px;
font-weight: bold;
color: #1d4ed8;
}
</style>
</head>
<body>

<header>
Pengaturan Pajak & Pendapatan
</header>

<div class="container">

<!-- Tombol Kembali ke Dashboard berbentuk button penuh -->
<button class="btn-kembali" onclick="location.href='admin-dashboard.html'">← Kembali ke Dashboard</button>

<!-- Card Pengaturan -->
<div class="card">
    <h3>Konfigurasi Potongan Pajak Sistem</h3>
    <form id="form-pajak">
        <div class="form-group">
            <label>Status Pajak:</label>
            <select id="statusPajak">
                <option value="aktif">Aktif</option>
                <option value="nonaktif">Nonaktif</option>
            </select>
        </div>
        <div class="form-group">
            <label>Persentase Pajak (%):</label>
            <input type="number" id="persenPajak" value="10" readonly style="background: #e5e7eb; cursor: not-allowed;">
        </div>
        <div class="form-group">
            <label>Biaya Admin Tambahan (Rupiah):</label>
            <input type="number" id="biayaAdmin" placeholder="Contoh: 0 atau 1000" required>
        </div>
        <button type="submit">Simpan Pengaturan Pajak</button>
    </form>
</div>

<!-- Card Penghasilan Pajak -->
<div class="card">
    <h3>Laporan Penghasilan Pajak</h3>
    <p style="color: #666; font-size: 13px;">Total akumulasi pendapatan dari potongan pajak 10% penarikan member:</p>
    
    <div class="stat-box">
        <h4>Total Pendapatan Pajak</h4>
        <p id="totalPajakTerKumpul">Rp 0</p>
    </div>
</div>

</div>

<!-- Skrip Firebase & Logika Perhitungan Pajak -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCqE8yJBHcCiWbgOo53RR-TlZW-Ia8XTvc",
      authDomain: "tebak-tebak-cuan-ef0d7.firebaseapp.com",
      projectId: "tebak-tebak-cuan-ef0d7",
      storageBucket: "tebak-tebak-cuan-ef0d7.firebasestorage.app",
      messagingSenderId: "399613865817",
      appId: "1:399613865817:web:0eae23e826d8544741e648"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const formPajak = document.getElementById('form-pajak');
    const statusPajakSelect = document.getElementById('statusPajak');
    const biayaAdminInput = document.getElementById('biayaAdmin');
    const totalPajakText = document.getElementById('totalPajakTerKumpul');

    // 1. Muat pengaturan pajak & hitung total penghasilan pajak dari koleksi penarikan
    async function muatDataDanHitungPajak() {
        try {
            // Ambil pengaturan dari Firestore
            const docRef = doc(db, "pengaturan", "pajak_transaksi");
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                statusPajakSelect.value = data.status || 'aktif';
                biayaAdminInput.value = data.biayaTetap || 0;
            }

            // Ambil data dari koleksi 'penarikan' untuk kalkulasi total pajak terkumpul
            const querySnapshot = await getDocs(collection(db, "penarikan"));
            let totalPajak = 0;

            querySnapshot.forEach((docItem) => {
                const item = docItem.data();
                if (item.potonganPajak) {
                    totalPajak += Number(item.potonganPajak);
                }
            });

            // Format ke Rupiah
            totalPajakText.innerText = "Rp " + totalPajak.toLocaleString('id-ID');

        } catch (error) {
            console.error("Gagal memuat data penghasilan pajak:", error);
        }
    }

    // 2. Simpan Pengaturan Pajak ke Firestore
    formPajak.addEventListener('submit', async (e) => {
        e.preventDefault();

        const status = statusPajakSelect.value;
        const biayaTetap = Number(biayaAdminInput.value);

        try {
            await setDoc(doc(db, "pengaturan", "pajak_transaksi"), {
                status: status,
                persen: 10,
                biayaTetap: biayaTetap,
                updatedAt: new Date()
            });

            alert("Pengaturan pajak berhasil disimpan!");
        } catch (error) {
            alert("Gagal menyimpan pengaturan: " + error.message);
        }
    });

    window.onload = muatDataDanHitungPajak;
</script>

</body>
</html>
