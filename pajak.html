<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan Pajak & Penghasilan - Admin Tebak-Tebak Cuan</title>

<style>
body{
font-family:Arial, sans-serif;
background:#f5f5f5;
margin:0;
}

header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
font-size:24px;
}

.container{
padding:20px;
max-width: 600px;
margin: auto;
}

.card {
background: white;
padding: 20px;
border-radius: 10px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
margin-bottom: 20px;
}

.form-group {
margin-bottom: 15px;
}

label {
display: block;
margin-bottom: 5px;
font-weight: bold;
color: #333;
}

input, select {
width: 100%;
padding: 10px;
border: 1px solid #ccc;
border-radius: 6px;
box-sizing: border-box;
font-size: 14px;
}

button {
padding: 10px 15px;
font-size: 14px;
border: none;
border-radius: 6px;
background: #2563eb;
color: white;
cursor: pointer;
width: 100%;
}

button:hover {
opacity: 0.9;
}

.btn-kembali {
background: #6b7280;
margin-bottom: 20px;
width: 100%;
}

.btn-kembali:hover {
background: #4b5563;
}

.stat-box {
background: #eff6ff;
border: 1px solid #bfdbfe;
padding: 15px;
border-radius: 8px;
text-align: center;
margin-top: 15px;
}

.stat-box h4 {
margin: 0 0 5px 0;
color: #1e40af;
font-size: 14px;
}

.stat-box p {
margin: 0;
font-size: 22px;
font-weight: bold;
color: #1d4ed8;
}
</style>
</head>
<body>

<header>
Pengaturan Pajak & Pendapatan
</header>

<div class="container">

<button class="btn-kembali" onclick="location.href='admin-dashboard.html'">← Kembali ke Dashboard</button>

<div class="card">
    <h3>Konfigurasi Potongan Pajak Sistem</h3>
    <form id="form-pajak">
        <div class="form-group">
            <label>Status Pajak:</label>
            <select id="statusPajak">
                <option value="aktif">Aktif</option>
                <option value="nonaktif">Nonaktif</option>
            </select>
        </div>
        <div class="form-group">
            <label>Persentase Pajak (%):</label>
            <input type="number" id="persenPajak" value="10" readonly style="background: #e5e7eb; cursor: not-allowed;">
        </div>
        <div class="form-group">
            <label>Biaya Admin Tambahan (Rupiah):</label>
            <input type="number" id="biayaAdmin" placeholder="Contoh: 0 atau 1000" required>
        </div>
        <button type="submit">Simpan Pengaturan Pajak</button>
    </form>
</div>

<div class="card">
    <h3>Laporan Penghasilan Pajak</h3>
    <p style="color: #666; font-size: 13px;">Total akumulasi pendapatan dari potongan pajak 10% penarikan member:</p>
    
    <div class="stat-box">
        <h4>Total Pendapatan Pajak</h4>
        <p id="totalPajakTerKumpul">Rp 0</p>
    </div>
</div>

</div>

<script type="module">
    // Diselaraskan menggunakan Firebase v10.7.1
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const formPajak = document.getElementById('form-pajak');
    const statusPajakSelect = document.getElementById('statusPajak');
    const biayaAdminInput = document.getElementById('biayaAdmin');
    const totalPajakText = document.getElementById('totalPajakTerKumpul');

    
          async function muatDataDanHitungPajak() {
        try {
            const docRef = doc(db, "pengaturan", "pajak_transaksi");
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                statusPajakSelect.value = data.status || 'aktif';
                biayaAdminInput.value = data.biayaTetap || 0;
            }

            // Ambil semua data dari koleksi 'penarikan'
            const querySnapshot = await getDocs(collection(db, "penarikan"));
            let totalPajak = 0;

            querySnapshot.forEach((docItem) => {
                const item = docItem.data();
                
                // Cari nominal penarikan dari berbagai kemungkinan nama field
                const nominalTrx = Number(item.jumlahMinta || item.JumlahMinta || item.jumlah || item.Jumlah || 0);
                
                // Akumulasikan 10% dari setiap nominal penarikan sebagai pendapatan pajak admin
                const pajakItem = nominalTrx * 0.10;
                totalPajak += pajakItem;
            });

            // Tampilkan total akumulasi pajak ke layar admin
            totalPajakText.innerText = "Rp " + totalPajak.toLocaleString('id-ID');

        } catch (error) {
            console.error("Gagal memuat data penghasilan pajak:", error);
            totalPajakText.innerText = "Gagal memuat";
        }
    }
