<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin - Tebak-Tebak Cuan</title>
<style>
body{ margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
.login-container{ width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
h2{ text-align: center; color: #cc3333; margin-top: 0; }
p{ text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
.form-group{ margin-bottom: 15px; }
label{ display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #333; }
input{ width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
input:focus{ border-color: #cc3333; outline: none; }
button{ width: 100%; padding: 12px; margin-top: 10px; background: #cc3333; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
button:hover{ background: #a32929; }
button:disabled{ background: #ccc; cursor: not-allowed; }
.back-link{ text-align: center; margin-top: 15px; }
.back-link a{ color: #666; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<div class="login-container">
    <h2>🔐 Login Admin</h2>
    <p>Masuk langsung via Database Firestore</p>
    <form id="adminLoginForm">
        <div class="form-group">
            <label>Email Admin</label>
            <input type="email" id="emailInput" placeholder="Masukkan email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Masukkan password" required>
        </div>
        <button type="submit" id="submitBtn">Masuk Sistem</button>
    </form>
    <div class="back-link">
        <a href="../index.html">🏠 Kembali ke Beranda Utama</a>
    </div>
</div>

<script type="module">
    // Menghubungkan langsung ke Database Firestore
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyCJUPTN5th-PgSHsXRTFbn2K77Uhvqgy9I",
      authDomain: "tebak-tebak-cuan-ef0d7.firebaseapp.com",
      projectId: "tebak-tebak-cuan-ef0d7",
      storageBucket: "tebak-tebak-cuan-ef0d7.firebasestorage.app",
      messagingSenderId: "106972320447",
      appId: "1:106972320447:web:f903ac120138202bc7ec0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const adminLoginForm = document.getElementById('adminLoginForm');
    const submitBtn = document.getElementById('submitBtn');

    adminLoginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const inputEmail = document.getElementById('emailInput').value.trim();
        const inputPassword = document.getElementById('passwordInput').value.trim();

        submitBtn.disabled = true;
        submitBtn.innerText = "Memeriksa Database...";

        try {
            // Mengambil semua data dari koleksi "user" di Firestore yang sedang Anda buka
            const querySnapshot = await getDocs(collection(db, "user"));
            let userDitemukan = false;

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                // Sesuaikan nama field di database Anda (misal: data.email dan data.password)
                if (data.email === inputEmail && data.password === inputPassword) {
                    userDitemukan = true;
                }
            });

            if (userDitemukan) {
                alert("Login Berhasil! Selamat datang Admin.");
                window.location.href = "admin-dashboard.html";
            } else {
                alert("Email atau Password tidak cocok dengan data di Database Firestore!");
                submitBtn.disabled = false;
                submitBtn.innerText = "Masuk Sistem";
            }

        } catch (error) {
            console.error("Error:", error);
            alert("Terjadi kesalahan koneksi database: " + error.message);
            submitBtn.disabled = false;
            submitBtn.innerText = "Masuk Sistem";
        }
    });
</script>
</body>
</html>
