<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Transaksi - Admin Tebak-Tebak Cuan</title>

<style>
body{
font-family:Arial, sans-serif;
background:#f5f5f5;
margin:0;
}

header{
background:#2563eb;
color:white;
padding:20px;
text-align:center;
font-size:24px;
}

.container{
padding:20px;
max-width: 1000px;
margin: auto;
}

.card {
background: white;
padding: 20px;
border-radius: 10px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
margin-bottom: 20px;
overflow-x: auto;
}

table {
width: 100%;
border-collapse: collapse;
margin-top: 10px;
white-space: nowrap;
}

th, td {
padding: 12px;
text-align: left;
border-bottom: 1px solid #ddd;
font-size: 14px;
}

th {
background-color: #f8f9fa;
color: #333;
}

.btn-kembali {
background: #6b7280;
margin-bottom: 15px;
width: auto;
padding: 10px 15px;
font-size: 14px;
border-radius: 8px;
color: white;
border: none;
cursor: pointer;
}
.btn-kembali:hover {
opacity: 0.9;
}
</style>
</head>
<body>

<header>
Riwayat Transaksi & Aktivitas
</header>

<div class="container">

<!-- Tombol kembali sudah mengarah langsung ke file admin-dashboard.html -->
<button class="btn-kembali" onclick="location.href='admin-dashboard.html'">← Kembali ke Dashboard</button>

<div class="card">
    <h3>Log Riwayat Deposit & Penarikan Member</h3>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>ID Member</th>
                <th>Nama Member</th>
                <th>Jenis Transaksi</th>
                <th>Nominal</th>
                <th>Status</th>
                <th>Waktu</th>
            </tr>
        </thead>
        <tbody id="tabel-riwayat">
            <tr>
                <td colspan="7" style="text-align: center; color: #666;">Memuat riwayat transaksi...</td>
            </tr>
        </tbody>
    </table>
</div>

</div>

<!-- Skrip Firebase & Logika Riwayat -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCqE8yJBHcCiWbgOo53RR-TlZW-Ia8XTvc",
        authDomain: "tebak-tebak-cuan-ef0d7.firebaseapp.com",
        projectId: "tebak-tebak-cuan-ef0d7",
        storageBucket: "tebak-tebak-cuan-ef0d7.firebasestorage.app",
        messagingSenderId: "399613865817",
        appId: "1:399613865817:web:0eae23e826d8544741e648",
        measurementId: "G-E9227HR8G8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function muatRiwayat() {
        const tabelBody = document.getElementById('tabel-riwayat');
        
        try {
            tabelBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #666;">Memuat riwayat transaksi...</td></tr>`;
            let semuaTransaksi = [];

            const namaMemberCache = {};

            async function ambilNamaMember(uid) {
                if (!uid || uid === '-') return '-';
                if (namaMemberCache[uid]) return namaMemberCache[uid];

                try {
                    const memberDoc = await getDoc(doc(db, "member", uid));
                    if (memberDoc.exists()) {
                        const d = memberDoc.data();
                        const nama = d.nama || d.Nama || d.username || d.Username || d.name || 'Tanpa Nama';
                        namaMemberCache[uid] = nama;
                        return nama;
                    }
                } catch (e) {
                    console.log("Gagal ambil nama member:", e);
                }
                return 'Tidak Dikenal';
            }

            // 1. Ambil data dari koleksi 'deposit'
            try {
                const queryDeposit = await getDocs(collection(db, "deposit"));
                for (const docSnap of queryDeposit.docs) {
                    const data = docSnap.data();
                    const uid = data.uid || '-';
                    const namaMember = await ambilNamaMember(uid);
                    semuaTransaksi.push({
                        uid: uid,
                        nama: namaMember,
                        jenis: 'Deposit / Top-Up',
                        jumlah: Number(data.jumlah || data.nominal || 0),
                        status: data.status || 'Pending',
                        tanggal: data.tanggal || null
                    });
                }
            } catch (e) {
                console.log("Error ambil deposit:", e);
            }

            // 2. Ambil data dari koleksi 'penarikan'
            try {
                const queryPenarikan = await getDocs(collection(db, "penarikan"));
                for (const docSnap of queryPenarikan.docs) {
                    const data = docSnap.data();
                    const uid = data.uid || '-';
                    const namaMember = await ambilNamaMember(uid);
                    semuaTransaksi.push({
                        uid: uid,
                        nama: namaMember,
                        jenis: 'Penarikan / Withdraw',
                        jumlah: Number(data.jumlah || data.nominal || 0),
                        status: data.status || 'Pending',
                        tanggal: data.tanggal || null
                    });
                }
            } catch (e) {
                console.log("Error ambil penarikan:", e);
            }

            if (semuaTransaksi.length === 0) {
                tabelBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #666;">Belum ada riwayat transaksi.</td></tr>`;
                return;
            }

            // 3. Urutkan berdasarkan waktu terbaru
            semuaTransaksi.sort((a, b) => {
                const waktuA = a.tanggal ? a.tanggal.seconds : 0;
                const waktuB = b.tanggal ? b.tanggal.seconds : 0;
                return waktuB - waktuA;
            });

            tabelBody.innerHTML = "";
            let no = 0;
            semuaTransaksi.forEach((data) => {
                no++;
                const status = data.status;
                
                let warnaStatus = 'orange';
                if (status === 'Berhasil' || status === 'Disetujui') warnaStatus = 'green';
                else if (status === 'Ditolak') warnaStatus = 'red';

                const row = `
                    <tr>
                        <td>${no}</td>
                        <td style="font-size: 12px; color: #555;">${data.uid}</td>
                        <td><strong>${data.nama}</strong></td>
                        <td>${data.jenis}</td>
                        <td><strong>Rp ${data.jumlah.toLocaleString()}</strong></td>
                        <td><span style="color: ${warnaStatus}; font-weight: bold;">${status}</span></td>
                        <td>${data.tanggal ? new Date(data.tanggal.seconds * 1000).toLocaleString('id-ID') : '-'}</td>
                    </tr>
                `;
                tabelBody.innerHTML += row;
            });

        } catch (error) {
            console.error("Gagal memuat riwayat:", error);
            tabelBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Gagal memuat data riwayat dari database.</td></tr>`;
        }
    }

    window.onload = muatRiwayat;
</script>

</body>
</html>
