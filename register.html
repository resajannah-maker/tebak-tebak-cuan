<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Akun - Tebak-Tebak Cuan</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.container{
    width:350px;
    margin:40px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#00a86b;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#00a86b;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#008f5a;
}

p{
    text-align:center;
}
</style>

</head>
<body>

<div class="container">

<h2>Daftar Akun</h2>

<form id="registerForm">

<input type="text" id="nama" placeholder="Nama Lengkap" required>

<input type="text" id="username" placeholder="Username" required>

<input type="email" id="email" placeholder="Email" required>

<input type="tel" id="hp" placeholder="Nomor HP" required>

<input type="text" id="metode" placeholder="Metode Pembayaran (DANA, BCA, OVO, dll)" required>

<input type="text" id="namaRekening" placeholder="Nama Pemilik Rekening" required>

<input type="text" id="nomorRekening" placeholder="Nomor Rekening / Nomor E-Wallet" required>

<input type="password" id="password" placeholder="Password" required>

<input type="password" id="konfirmasi" placeholder="Konfirmasi Password" required>

<button type="submit">Daftar</button>

</form>

<p>Sudah punya akun?<br>
<a href="login.html">Login di sini</a></p>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqE8yJBHcCiWbgOo53RR-TlZW-Ia8XTvc",
  authDomain: "tebak-tebak-cuan-ef0d7.firebaseapp.com",
  projectId: "tebak-tebak-cuan-ef0d7",
  storageBucket: "tebak-tebak-cuan-ef0d7.firebasestorage.app",
  messagingSenderId: "399613865817",
  appId: "1:399613865817:web:0eae23e826d8544741e648",
  measurementId: "G-E9227HR8G8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const nama = document.getElementById("nama").value;
    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const hp = document.getElementById("hp").value;
    const metode = document.getElementById("metode").value;
const namaRekening = document.getElementById("namaRekening").value;
const nomorRekening = document.getElementById("nomorRekening").value;
    const password = document.getElementById("password").value;
    const konfirmasi = document.getElementById("konfirmasi").value;

    if (password !== konfirmasi) {
        alert("Password tidak sama!");
        return;
    }

    try {
        const userCredential = await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        await setDoc(doc(db, "member", userCredential.user.uid), {
    nama: nama,
    username: username,
    email: email,
    hp: hp,
    metode: metode,
    namaRekening: namaRekening,
    nomorRekening: nomorRekening,
    poin: 0,
    dibuat: new Date()
});

        alert("Pendaftaran berhasil!");
        window.location.href = "index.html";

    } catch (error) {
        alert("Gagal daftar: " + error.message);
    }
});
</script>

</body>
</html>
