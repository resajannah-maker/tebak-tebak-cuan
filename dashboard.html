<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Tebak-Tebak Cuan</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    position: relative;
}

header{
    background:#009966;
    color:white;
    text-align:center;
    padding:20px;
    position: relative;
}

/* Style untuk ikon notifikasi di pojok kanan atas */
.notif-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: white;
    color: #009966;
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    text-decoration: none;
    z-index: 10;
}

.notif-btn:hover {
    background: #e6e6e6;
}

/* Badge angka pemberitahuan berwarna merah */
.badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: red;
    color: white;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 7px;
    border-radius: 50%;
    display: none; /* Otomatis muncul jika ada notif baru */
}

.container{
    max-width:700px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

.card{
    background:#f0f0f0;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#009966;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#007a52;
}
</style>

</head>

<body>

<header>
    <!-- Tombol Lonceng mengarah ke notif.html dengan Badge Merah -->
    <a href="notif.html" class="notif-btn" id="btnNotif">
        🔔
        <span class="badge" id="badgeNotif">0</span>
    </a>

    <h1>💰 Dashboard</h1>
    <p>Selamat Datang di Tebak-Tebak Cuan</p>
</header>

<div class="container">
  
<div class="card">
<h3>👤 Profil</h3>
<p>Nama : <span id="namaUser">Memuat...</span></p>
<p>ID : TTC000001</p>
</div>

<div class="card">
<h3>💳 Saldo</h3>
<p id="saldoUser">Rp 0</p>
</div>


<button onclick="location.href='game.html'">
🎮 Mulai Bermain
</button>

<button onclick="location.href='wallet.html'">
💼 Dompet
</button>

<button onclick="location.href='profile.html'">
⚙️ Profil Saya
</button>


<a href="index.html" style="text-decoration: none;">
    <button>🏠 Kembali ke Beranda</button>
</a>


</div>

<!-- Elemen Audio untuk Suara Notifikasi -->
<audio id="audioNotif" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqE8yJBHcCiWbgOo53RR-TlZW-Ia8XTvc",
  authDomain: "tebak-tebak-cuan-ef0d7.firebaseapp.com",
  projectId: "tebak-tebak-cuan-ef0d7",
  storageBucket: "tebak-tebak-cuan-ef0d7.firebasestorage.app",
  messagingSenderId: "399613865817",
  appId: "1:399613865817:web:0eae23e826d8544741e648"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    try {
        // 1. Ambil data profil & saldo user
        const docRef = doc(db, "member", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById("namaUser").textContent = data.nama || "-";
            const poin = data.poin || data.Saldo || data.saldo || 0;
            document.getElementById("saldoUser").textContent = "Rp " + Number(poin).toLocaleString("id-ID");
        }

        // 2. Pantau koleksi "notifikasi_member" secara Real-Time untuk hitung pesan yang belum dibaca
        const q = query(
            collection(db, "notifikasi_member"), 
            where("uid", "==", user.uid), 
            where("dibaca", "==", false)
        );
        
        let isInitialLoad = true;
        onSnapshot(q, (snapshot) => {
            const jumlahBelumDibaca = snapshot.size;
            const badge = document.getElementById("badgeNotif");
            const audio = document.getElementById("audioNotif");

            if (jumlahBelumDibaca > 0) {
                badge.textContent = jumlahBelumDibaca;
                badge.style.display = "inline-block";

                // Bunyikan suara jika ada notif baru masuk setelah halaman dibuka
                if (!isInitialLoad) {
                    audio.play().catch(e => console.log("Audio diblokir browser:", e));
                }
            } else {
                badge.style.display = "none";
            }
            isInitialLoad = false;
        });

    } catch (error) {
        console.error("Gagal memuat data:", error);
    }
});
</script>

</body>
</html>
