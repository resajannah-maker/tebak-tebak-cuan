<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Game - Admin Tebak-Tebak Cuan</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:600px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    margin-bottom: 20px;
}

h2{
    color:#2563eb;
    font-size: 18px;
}

input[type="text"], input[type="datetime-local"], textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    font-size:16px;
    border-radius:5px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

textarea{
    height:100px;
}

button{
    width:100%;
    padding:12px;
    background:#00a86b;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity: 0.9;
}

.btn-kembali {
    background: #6b7280;
    margin-bottom: 15px;
    width: auto;
    padding: 10px 15px;
    font-size: 14px;
    border-radius: 8px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 14px;
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
}

th {
    background: #f8f9fa;
}
</style>
</head>

<body>

<header>
<h1>⚙️ Kelola Game Kuis</h1>
</header>

<div class="container">
    <button class="btn-kembali" onclick="history.back()">← Kembali</button>

    <h2>Tambah Pertanyaan Kuis Baru</h2>
    
    <label>Judul / Topik Pertandingan:</label>
    <input type="text" id="inputJudul" placeholder="Contoh: Kecantikan">

    <label>Detail Soal / Deskripsi Pertandingan:</label>
    <textarea id="inputDeskripsi" placeholder="Ketik detail pertanyaan..."></textarea>

    <label>Batas Waktu Berakhir (Masa Aktif Soal):</label>
    <input type="datetime-local" id="inputBatasWaktu">

    <button onclick="terbitkanSoal()">Terbitkan Soal ke Aplikasi Member</button>
</div>

<div class="container">
    <h2>Daftar Soal di Database</h2>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Topik & Waktu</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tabelDaftarSoal">
            <tr>
                <td colspan="4" style="text-align: center; color: #666;">Memuat daftar soal...</td>
            </tr>
        </tbody>
    </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqE8yJBHcCiWbgOo53RR-TlZW-Ia8XTvc",
  authDomain: "tebak-tebak-cuan-ef0d7.firebaseapp.com",
  projectId: "tebak-tebak-cuan-ef0d7",
  storageBucket: "tebak-tebak-cuan-ef0d7.firebasestorage.app",
  messagingSenderId: "399613865817",
  appId: "1:399613865817:web:0eae23e826d8544741e648"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Fungsi untuk menerbitkan soal
window.terbitkanSoal = async function() {
    let judul = document.getElementById('inputJudul').value.trim();
    let deskripsi = document.getElementById('inputDeskripsi').value.trim();
    let batasWaktu = document.getElementById('inputBatasWaktu').value;

    if (judul === "" || deskripsi === "") {
        alert("Judul dan deskripsi soal tidak boleh kosong!");
        return;
    }

    try {
        await addDoc(collection(db, "soal"), {
            judul: judul,
            deskripsi: deskripsi,
            batasWaktu: batasWaktu || "-",
            tanggal: serverTimestamp()
        });

        alert("Soal berhasil diterbitkan!");
        
        // Kosongkan form
        document.getElementById('inputJudul').value = "";
        document.getElementById('inputDeskripsi').value = "";
        document.getElementById('inputBatasWaktu').value = "";

        // Muat ulang daftar soal di bawah
        muatDaftarSoal();

    } catch (error) {
        console.error("Gagal menerbitkan soal:", error);
        alert("Terjadi kesalahan: " + error.message);
    }
}

// Fungsi untuk memuat daftar soal ke tabel di bawah
async function muatDaftarSoal() {
    const tabel = document.getElementById('tabelDaftarSoal');
    try {
        const querySnapshot = await getDocs(collection(db, "soal"));
        tabel.innerHTML = "";

        if (querySnapshot.empty) {
            tabel.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #666;">Belum ada soal kuis yang dibuat.</td></tr>`;
            return;
        }

        let no = 0;
        querySnapshot.forEach((docSnap) => {
            no++;
            let data = docSnap.data();
            let id = docSnap.id;

            let row = `
                <tr>
                    <td>${no}</td>
                    <td><b>${data.judul}</b><br><small style="color:#666;">Batas: ${data.batasWaktu}</small></td>
                    <td><span style="color: green; font-weight: bold;">Aktif</span></td>
                    <td><button onclick="hapusSoal('${id}')" style="background: red; padding: 5px 10px; font-size: 12px; width: auto;">Hapus</button></td>
                </tr>
            `;
            tabel.innerHTML += row;
        });

    } catch (e) {
        console.error("Gagal memuat daftar soal:", e);
        tabel.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Gagal memuat data.</td></tr>`;
    }
}

// Fungsi untuk menghapus soal
window.hapusSoal = async function(id) {
    let konfirmasi = confirm("Yakin ingin menghapus soal ini?");
    if (!konfirmasi) return;

    try {
        await deleteDoc(doc(db, "soal", id));
        alert("Soal berhasil dihapus!");
        muatDaftarSoal();
    } catch (e) {
        alert("Gagal menghapus soal: " + e.message);
    }
}

// Jalankan saat halaman dibuka
window.onload = muatDaftarSoal;
</script>

</body>
</html>
