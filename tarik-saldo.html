<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqE8yJBHcCiWbgOo53RR-TlZW-Ia8XTvc",
  authDomain: "tebak-tebak-cuan-ef0d7.firebaseapp.com",
  projectId: "tebak-tebak-cuan-ef0d7",
  storageBucket: "tebak-tebak-cuan-ef0d7.firebasestorage.app",
  messagingSenderId: "399613865817",
  appId: "1:399613865817:web:0eae23e826d8544741e648"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    currentUser = user;
});

document.getElementById("tarikForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!currentUser) {
        alert("Sesi login berakhir, silakan login ulang.");
        return;
    }

    const jumlahMinta = Number(document.getElementById("jumlah").value);
    const tujuan = document.getElementById("tujuan").value;
    const nomorTujuan = document.getElementById("nomorTujuan").value;

    if (jumlahMinta < 5000) {
        alert("Minimal penarikan adalah Rp 5.000!");
        return;
    }

    const btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    btn.textContent = "Mengirim Pengajuan...";

    try {
        const userDocRef = doc(db, "member", currentUser.uid);
        const userSnap = await getDoc(userDocRef);
        
        if(!userSnap.exists()){
            alert("Data member tidak ditemukan!");
            btn.disabled = false;
            btn.textContent = "Ajukan Penarikan";
            return;
        }

        const dataUser = userSnap.data();

        // Cari field saldo secara fleksibel (pastikan field di database Anda bernama 'saldo' atau 'poin')
        let poinUser = Number(dataUser.poin ?? dataUser.Poin ?? dataUser.saldo ?? dataUser.Saldo ?? 0);
        
        if(poinUser < jumlahMinta) {
            alert(`Saldo/Poin Anda tidak mencukupi!\nSaldo terbaca: Rp ${poinUser.toLocaleString()}\nJumlah diminta: Rp ${jumlahMinta.toLocaleString()}`);
            btn.disabled = false;
            btn.textContent = "Ajukan Penarikan";
            return;
        }

        // PERHITUNGAN PAJAK 10%
        const pajak = jumlahMinta * 0.10;         
        const jumlahBersih = jumlahMinta - pajak; 

        // HANYA simpan pengajuan ke koleksi "penarikan" dengan status Pending. 
        // Saldo TIDAK dikurangi di sini agar tidak terpotong dua kali. Saldo akan dikurangi admin saat disetujui.
        await addDoc(collection(db, "penarikan"), {
            uid: currentUser.uid,
            namaRekening: dataUser.nama || dataUser.Nama || dataUser.username || "User",
            nama: dataUser.nama || dataUser.Nama || dataUser.username || "User",
            jumlahMinta: jumlahMinta, 
            potonganPajak: pajak,     
            jumlah: jumlahBersih,     
            jumlahBersih: jumlahBersih,
            metode: tujuan,           
            tujuan: tujuan,
            nomorRekening: nomorTujuan, 
            nomorTujuan: nomorTujuan,
            status: "Pending", 
            tanggal: serverTimestamp()
        });

        alert(`Pengajuan penarikan berhasil dikirim!\nJumlah ditarik: Rp ${jumlahMinta.toLocaleString()}\nPotongan Pajak (10%): Rp ${pajak.toLocaleString()}\nJumlah Diterima: Rp ${jumlahBersih.toLocaleString()}`);
        window.location.href = "dashboard.html";

    } catch (error) {
        console.error("Error:", error);
        alert("Gagal mengajukan penarikan: " + error.message);
        btn.disabled = false;
        btn.textContent = "Ajukan Penarikan";
    }
});
</script>
