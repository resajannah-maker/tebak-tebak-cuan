<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarik Saldo - Tebak-Tebak Cuan</title>
<style>
body{ font-family:Arial,sans-serif; background:#f5f5f5; margin:0; padding:20px; }
.box{ max-width:500px; margin:auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,.2); }
h2{ text-align:center; color:#00a86b; }
input, select{ width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box; }
button{ width:100%; padding:12px; margin-top:10px; background:#00a86b; color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px; }
button:hover{ background:#008f5a; }
.btn-kembali{ background:#888; }
.btn-kembali:hover{ background:#666; }
.info-pajak{ font-size: 13px; color: #d97706; margin-bottom: 10px; font-weight: bold; text-align: center; }
</style>
</head>
<body>

<div class="box">
    <h2>💰 Tarik Saldo</h2>
    <div class="info-pajak">⚠️ Tiap penarikan akan dikenakan potongan pajak 10%</div>
    
    <form id="tarikForm">
        <label>Masukkan jumlah penarikan (Rp):</label>
        <input type="number" id="jumlah" placeholder="Contoh: 10000" required>

        <label>Pilih tujuan:</label>
        <select id="tujuan" required>
            <option value="">Pilih Metode</option>
            <option value="DANA">DANA</option>
            <option value="OVO">OVO</option>
            <option value="BCA">BCA</option>
        </select>

        <label>Nomor Rekening / E-Wallet:</label>
        <input type="text" id="nomorTujuan" placeholder="Masukkan nomor akun/rekening" required>

        <button type="submit" id="btnSubmit">Ajukan Penarikan</button>
    </form>

<button type="button" class="btn-kembali" onclick="location.href='dashboard.html'">Kembali</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqE8yJBHcCiWbgOo53RR-TlZW-Ia8XTvc",
  authDomain: "tebak-tebak-cuan-ef0d7.firebaseapp.com",
  projectId: "tebak-tebak-cuan-ef0d7",
  storageBucket: "tebak-tebak-cuan-ef0d7.firebasestorage.app",
  messagingSenderId: "399613865817",
  appId: "1:399613865817:web:0eae23e826d8544741e648"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    currentUser = user;
});

document.getElementById("tarikForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!currentUser) {
        alert("Sesi login berakhir, silakan login ulang.");
        return;
    }

    const jumlahMinta = Number(document.getElementById("jumlah").value);
    const tujuan = document.getElementById("tujuan").value;
    const nomorTujuan = document.getElementById("nomorTujuan").value;

    if (jumlahMinta < 5000) {
        alert("Minimal penarikan adalah Rp 5.000!");
        return;
    }

    const btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    btn.textContent = "Mengirim Pengajuan...";

    try {
        const userDocRef = doc(db, "member", currentUser.uid);
        const userSnap = await getDoc(userDocRef);
        
        let namaMember = "User";
        if(userSnap.exists()){
            namaMember = userSnap.data().nama || "User";
            let poinUser = Number(userSnap.data().poin || userSnap.data().Poin || userSnap.data().saldo || userSnap.data().Saldo || 0);
            
            if(poinUser < jumlahMinta) {
                alert("Saldo/Poin Anda tidak mencukupi untuk penarikan ini!");
                btn.disabled = false;
                btn.textContent = "Ajukan Penarikan";
                return;
            }
        }

        // PERHITUNGAN PAJAK 10%
        const pajak = jumlahMinta * 0.10;         // Besar potongan 10%
        const jumlahBersih = jumlahMinta - pajak; // Saldo bersih setelah dipotong pajak

        // Simpan data pengajuan penarikan ke koleksi "penarikan" (disesuaikan dengan kebutuhan Admin)
        await addDoc(collection(db, "penarikan"), {
            uid: currentUser.uid,
            namaRekening: namaMember,
            nama: namaMember,
            jumlahMinta: jumlahMinta, 
            potonganPajak: pajak,     
            jumlah: jumlahMinta,      // Mengirim jumlahMinta agar Admin bisa memotong saldo awal dengan benar
            jumlahBersih: jumlahBersih,
            metode: tujuan,           // Disesuaikan agar dibaca Admin
            tujuan: tujuan,
            nomorRekening: nomorTujuan, // Disesuaikan agar dibaca Admin
            nomorTujuan: nomorTujuan,
            status: "Pending", 
            tanggal: serverTimestamp()
        });

        alert(`Pengajuan penarikan berhasil dikirim!\nJumlah ditarik: Rp ${jumlahMinta.toLocaleString()}\nPotongan Pajak (10%): Rp ${pajak.toLocaleString()}\nJumlah Diterima: Rp ${jumlahBersih.toLocaleString()}`);
        window.location.href = "dashboard.html";

    } catch (error) {
        console.error("Error:", error);
        alert("Gagal mengajukan penarikan: " + error.message);
        btn.disabled = false;
        btn.textContent = "Ajukan Penarikan";
    }
});
</script>

</body>
</html>
